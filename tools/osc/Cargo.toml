[workspace]
resolver = "2"

[package]
name        = "osc"
version     = "0.1.0"
edition     = "2024"
description = "Operator CLI for an osc-native bus through the osc-adapter: discover, provision, calibrate, manage."
license     = "MIT OR Apache-2.0"

[dependencies]
anyhow       = "1"
clap         = { version = "4", features = ["derive"] }
ctrlc        = "3"
dialoguer    = "0.11"
libc         = "0.2"
osc-client   = { path = "../../client" }
osc-ident    = { path = "../../ident" }
osc-protocol = { path = "../../firmware/lib/osc-protocol" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
